  $("#main").innerHTML = m;

      <div class="row"><button class="btn">Huỷ</button><button class="btn pri">Tạo kiểu</button></div></div></div>`
    : S==="huy" ? `<div class="modal-bg"><div class="card modal"><h3>Hủy lượt này để chia lại?</h3>

      <div class="faint" style="margin-top:8px">Sau khi hủy, chạy trên máy dev (thử khô, thêm <code>--yes</code> để làm thật):</div>
